version: 2
updates:
  # Version updates are dormant: a limit of 0 opens no version update pull
  # requests while a series of dependency changes is still landing. Security
  # updates are a repository setting and unaffected by the limit; they are
  # grouped here so that one alert sweep arrives as one consistent pull
  # request per module rather than one per dependency, which cannot be
  # guaranteed to build on its own.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      go-dependencies:
        patterns:
          - "*"
      go-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /acme/sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      go-dependencies:
        patterns:
          - "*"
      go-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
