version: 2
updates:
  # Updates within an ecosystem are grouped, so each one opens at most a single
  # pull request per run; the limit is there to keep a stuck group from piling
  # up. Security updates are unaffected by it.
  #
  # The root module requires acme/sidecar through a replace directive, so its
  # dependencies are part of the root's graph and a bump here updates both
  # go.mod files. A separate entry for the sidecar would only open pull
  # requests that the root's supersede.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
