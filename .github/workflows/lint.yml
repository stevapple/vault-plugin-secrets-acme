name: Lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # golangci-lint stops at a module boundary, so the sidecar module has
        # to be linted from its own directory or it is not linted at all.
        module: [".", "acme/sidecar"]
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.work

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Minor, not patch: golangci-lint adds and tightens linters in minor
        # releases, so floating them turns an unrelated pull request red with
        # no code change. Patch releases are fixes, and are worth taking.
        version: v2.13
        working-directory: ${{ matrix.module }}
