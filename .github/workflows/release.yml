name: Publish release
on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # goreleaser writes the release notes from the commits between the
        # previous tag and this one, and needs the tags and their history to
        # find them; a shallow clone hides both, and the v0.4.0 run resolved
        # the previous tag as "<unknown>".
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.work
    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2
    - name: Build and publish
      uses: goreleaser/goreleaser-action@v7
      with:
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}