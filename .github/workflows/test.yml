name: Tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A second push to a pull request makes the run already in flight pointless,
# and each one builds Pebble and downloads Vault.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests (Vault ${{ matrix.vault }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Newest of each major Vault line still in use.
        vault: ["1.21.4", "2.1.0"]
    env:
      VAULT_VERSION: ${{ matrix.vault }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.work

    - name: Install Pebble test ACME server
      # Pebble is a test dependency built from source, and the Go it needs is
      # its own business: setup-go pins GOTOOLCHAIN=local to this repository's
      # go.work, which is the right floor for our code but not for Pebble's.
      env:
        GOTOOLCHAIN: auto
      run: |
        go install github.com/letsencrypt/pebble/v2/...@v2.10.1

    - name: Run unit tests
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        make test

    - name: Run acceptance tests
      run: |
        curl -sLo vault.zip "https://releases.hashicorp.com/vault/$VAULT_VERSION/vault_${VAULT_VERSION}_linux_amd64.zip"
        unzip vault.zip
        sudo mv vault /usr/local/bin/vault
        make testacc
