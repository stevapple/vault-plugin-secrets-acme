name: Feature request
description: Something the engine should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, rather than the change you have in mind for it.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: How you work around its absence, if you do.
  - type: input
    id: prior-art
    attributes:
      label: Prior art
      description: >
        If Vault's PKI engine, cert-manager or another ACME client already does
        this, a link. Matching an existing shape beats inventing one.
