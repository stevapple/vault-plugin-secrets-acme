version: 2
builds:
  - main: ./cmd/vault-plugin-secrets-acme
    id: vault-acme
    binary: vault-plugin-secrets-acme
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm64
    # The matrix is Vault's own: a secrets plugin runs as a second process
    # beside the server, so a platform Vault does not ship is a platform the
    # plugin cannot be loaded on. These three are the combinations Go will
    # build but Vault does not publish.
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: freebsd
        goarch: arm64
      - goos: windows
        goarch: arm64
  - main: ./cmd/sidecar
    id: vault-acme-sidecar
    binary: vault-acme-sidecar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm64
    # The matrix is Vault's own: a secrets plugin runs as a second process
    # beside the server, so a platform Vault does not ship is a platform the
    # plugin cannot be loaded on. These three are the combinations Go will
    # build but Vault does not publish.
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: freebsd
        goarch: arm64
      - goos: windows
        goarch: arm64

gomod:
  proxy: false

archives:
  - formats:
    - binary

checksum:
  algorithm: sha256

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    output: true
    artifacts: checksum
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes