version: 2
builds:
  - main: ./cmd/vault-plugin-secrets-acme
    id: vault-acme
    binary: vault-plugin-secrets-acme
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm64
    # The matrix is Vault's own: a secrets plugin runs as a second process
    # beside the server, so a platform Vault does not ship is a platform the
    # plugin cannot be loaded on. These two are the combinations Go will
    # build but Vault does not publish; darwin/386 is not a Go target at all.
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: windows
        goarch: arm64
  - main: ./cmd/sidecar
    id: vault-acme-sidecar
    binary: vault-acme-sidecar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm64
    # The matrix is Vault's own: a secrets plugin runs as a second process
    # beside the server, so a platform Vault does not ship is a platform the
    # plugin cannot be loaded on. These two are the combinations Go will
    # build but Vault does not publish; darwin/386 is not a Go target at all.
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: windows
        goarch: arm64

gomod:
  proxy: false

archives:
  - formats:
    - binary

checksum:
  algorithm: sha256

signs:
  - cmd: cosign
    # cosign v3 writes a single Sigstore bundle holding the signature and the
    # certificate; the separate --output-signature and --output-certificate
    # flags are deprecated and, with the bundle format, produce nothing.
    signature: "${artifact}.sigstore.json"
    output: true
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes